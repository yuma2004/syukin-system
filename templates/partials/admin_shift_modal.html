<div class="modal fade shift-modal" id="shiftEditModal" tabindex="-1" aria-labelledby="shiftEditModalTitle" aria-describedby="shiftEditModalDesc" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable shift-modal-dialog">
    <div class="modal-content shift-modal-content">
      <form method="POST" id="shiftEditForm">
        <header class="modal-header shift-modal-header">
          <div>
            <h2 class="modal-title shift-modal-title" id="shiftEditModalTitle">シフト編集</h2>
            <p class="shift-modal-date">管理者による時刻修正</p>
          </div>
          <button type="button" class="shift-modal-close" data-bs-dismiss="modal" aria-label="閉じる">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        </header>

        <div class="modal-body shift-modal-body">
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
          <p class="shift-modal-desc" id="shiftEditModalDesc">時刻を更新すると監査ログに変更前後の値が記録されます。</p>
          <div class="visually-hidden" id="shiftEditStatus" role="status" aria-live="polite"></div>

          <div class="shift-modal-user">
            <p class="shift-modal-user-name" id="shiftEditUser">&nbsp;</p>
            <p class="shift-modal-user-sub" id="shiftEditSummary">&nbsp;</p>
          </div>

          <div class="shift-modal-time-grid">
            <section class="shift-modal-time-card">
              <label class="form-label shift-modal-label" for="shiftEditClockIn">出勤時刻 ({{ LOCAL_TZ_NAME }})</label>
              <div class="shift-modal-input-wrap">
                <input type="datetime-local" class="form-control shift-modal-input" id="shiftEditClockIn" name="clock_in_at" step="60" required data-modal-initial-focus>
                <span class="material-symbols-outlined shift-modal-input-icon" aria-hidden="true">schedule</span>
              </div>
              <div class="shift-modal-shortcuts" role="group" aria-label="出勤時刻ショートカット">
                <button type="button" data-set-now="#shiftEditClockIn">現在</button>
                <button type="button" data-adjust-target="#shiftEditClockIn" data-adjust-minutes="-15">-15分</button>
                <button type="button" data-adjust-target="#shiftEditClockIn" data-adjust-minutes="15">+15分</button>
                <button type="button" data-round-target="#shiftEditClockIn" data-round-minutes="5">5分丸め</button>
                <button type="button" data-clear-target="#shiftEditClockIn">クリア</button>
              </div>
              <p class="shift-modal-meta tabular-nums" id="shiftEditClockInMeta"></p>
            </section>

            <div class="shift-modal-arrow" aria-hidden="true">
              <span class="material-symbols-outlined">arrow_forward</span>
            </div>

            <section class="shift-modal-time-card">
              <label class="form-label shift-modal-label" for="shiftEditClockOut">退勤時刻 ({{ LOCAL_TZ_NAME }})</label>
              <div class="shift-modal-input-wrap">
                <input type="datetime-local" class="form-control shift-modal-input" id="shiftEditClockOut" name="clock_out_at" step="60">
                <span class="material-symbols-outlined shift-modal-input-icon" aria-hidden="true">schedule</span>
              </div>
              <div class="shift-modal-shortcuts" role="group" aria-label="退勤時刻ショートカット">
                <button type="button" data-set-now="#shiftEditClockOut">現在</button>
                <button type="button" data-adjust-target="#shiftEditClockOut" data-adjust-minutes="-15">-15分</button>
                <button type="button" data-adjust-target="#shiftEditClockOut" data-adjust-minutes="15">+15分</button>
                <button type="button" data-copy-from="#shiftEditClockIn" data-copy-target="#shiftEditClockOut">出勤をコピー</button>
                <button type="button" data-round-target="#shiftEditClockOut" data-round-minutes="5">5分丸め</button>
                <button type="button" data-clear-target="#shiftEditClockOut">クリア</button>
              </div>
              <p class="shift-modal-meta tabular-nums" id="shiftEditClockOutMeta"></p>
            </section>
          </div>

          <section class="shift-modal-stats" aria-label="集計">
            <article class="shift-modal-stat">
              <p>労働時間</p>
              <p class="tabular-nums" id="shiftEditWorked">--:--</p>
            </article>
            <article class="shift-modal-stat">
              <p>休憩</p>
              <p class="tabular-nums" id="shiftEditBreaks">--:--</p>
              <p class="shift-modal-stat-sub" id="shiftEditBreakCount"></p>
            </article>
            <article class="shift-modal-stat">
              <p>IP</p>
              <p class="shift-modal-ip tabular-nums" id="shiftEditIp"></p>
            </article>
          </section>

          <div class="alert alert-danger d-none shift-modal-error" id="shiftEditError" role="alert" aria-live="assertive"></div>
          <div class="shift-modal-loading text-center py-3 d-none" data-loading role="status" aria-live="polite">
            <div class="spinner-border" role="status" aria-hidden="true"></div>
            <div class="small mt-2">シフト情報を読み込み中…</div>
          </div>
        </div>

        <footer class="modal-footer shift-modal-footer">
          <a href="#" class="shift-modal-link" id="shiftEditDetailLink">詳細画面で編集</a>
          <div class="shift-modal-footer-actions">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
            <button type="submit" class="btn btn-primary">保存する</button>
          </div>
        </footer>
      </form>
    </div>
  </div>
</div>
