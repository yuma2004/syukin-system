<div class="mt-4">
  <div class="surface-subtle p-3">
    <h3 class="h6 mb-2">手動で出退勤を追加</h3>
    <p class="form-hint mb-3">値はすべて監査ログに記録されます。退勤時刻は未入力でも登録できます。</p>
    <form class="row gy-3 align-items-end" method="POST" action="{{ url_for('admin.shift_create') }}">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <input type="hidden" name="start" value="{{ start }}">
      <input type="hidden" name="end" value="{{ end }}">
      <input type="hidden" name="username" value="{{ user_username }}">
      <div class="col-md-3">
        <label class="form-label" for="shift-create-user">ユーザー</label>
        <select id="shift-create-user" name="user_id" class="form-select" required>
          <option value="" disabled selected>選択してください</option>
          {% for user in user_candidates %}
          <option value="{{ user.id }}">{{ user.name or user.username }} ({{ user.username }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="shift-create-clock-in">出勤 ({{ LOCAL_TZ_NAME }})</label>
        <input type="datetime-local" id="shift-create-clock-in" name="clock_in_at" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="shift-create-clock-out">退勤 (任意)</label>
        <input type="datetime-local" id="shift-create-clock-out" name="clock_out_at" class="form-control">
      </div>
      <div class="col-md-3 d-grid">
        <button type="submit" class="btn btn-outline-primary">追加</button>
      </div>
    </form>
    <p class="text-muted small mb-0 mt-2">退勤を空にすると「出勤中」のシフトとして登録されます。</p>
  </div>
</div>
