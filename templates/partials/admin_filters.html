<section class="admin-filter-card" aria-labelledby="admin-filter-title">
  <div class="admin-filter-head">
    <h2 class="admin-filter-title" id="admin-filter-title">
      <span class="material-symbols-outlined" aria-hidden="true">tune</span>
      <span>フィルター</span>
    </h2>
    <p class="admin-filter-help" id="admin-filter-help">期間とユーザーIDで一覧を絞り込みます。</p>
  </div>
  <div class="admin-filter-chipline" aria-hidden="true">
    <span class="admin-filter-chip">期間 {{ start }} ～ {{ end }}</span>
    <span class="admin-filter-chip">{{ user_username if user_username else "全ユーザー" }}</span>
  </div>

  <form class="admin-filter-form" method="get" aria-describedby="admin-filter-help">
    <div class="admin-filter-group">
      <label class="form-label" for="filter-start">開始日</label>
      <input type="date" class="form-control" id="filter-start" name="start" value="{{ start }}">
    </div>

    <div class="admin-filter-sep" aria-hidden="true">~</div>

    <div class="admin-filter-group">
      <label class="form-label" for="filter-end">終了日</label>
      <input type="date" class="form-control" id="filter-end" name="end" value="{{ end }}">
    </div>

    <div class="admin-filter-group admin-filter-group--user">
      <label class="form-label" for="filter-username">ユーザー検索</label>
      <input type="text" class="form-control" id="filter-username" name="username" value="{{ user_username }}" list="admin-username-list" placeholder="名前またはID" autocomplete="off" spellcheck="false">
      <datalist id="admin-username-list">
        {% for user in user_candidates %}
        <option value="{{ user.username }}">{{ user.name or user.username }}</option>
        {% endfor %}
      </datalist>
    </div>

    <div class="admin-filter-actions">
      <button class="btn btn-primary w-100" type="submit">フィルター適用</button>
      <a class="btn btn-outline-secondary w-100" href="{{ url_for('admin.dashboard') }}">リセット</a>
    </div>
  </form>
</section>
