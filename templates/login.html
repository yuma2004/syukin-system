{% extends "layout.html" %}
{% block title %}ログイン | 出退勤システム{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <section class="card section-card">
      <div class="card-body p-4">
        <header class="page-header text-center">
          <h1 class="page-title h4">ログイン</h1>
          <p class="text-muted mb-0" id="login-help">ユーザーIDとパスワードを入力して、出退勤操作を開始してください。</p>
        </header>

        <form method="post" class="mt-4" aria-describedby="login-help">
          <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
          <div class="mb-3">
            <label for="username" class="form-label">ユーザーID</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" value="on">
            <label class="form-check-label" for="remember_me">{{ remember_days }}日間ログイン状態を保持する</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">ログインする</button>
        </form>
      </div>
    </section>
  </div>
</div>
{% endblock %}
